# Run from the repository root:
# docker compose --env-file docker/.env -f docker/docker-compose.quickstart.yml -f docker/docker-compose.public.yml up --build -d paperclip
# The existing tuna container forwards the public URL to tuna-proxy:8080.
services:
    tuna-proxy:
        image: nginx:stable-alpine
        restart: unless-stopped
        networks:
            - tuna
        volumes:
            - ./tuna-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    paperclip-db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: paperclip
            POSTGRES_DB: paperclip
            POSTGRES_PASSWORD: "${PAPERCLIP_POSTGRES_PASSWORD:?Set a persistent database password in docker/.env}"
        volumes:
            - paperclip-public-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
            interval: 5s
            timeout: 5s
            retries: 30
    paperclip:
        # Codex bubblewrap needs nested user namespaces. Keep Docker capabilities
        # unchanged; allow its own sandbox to create namespaces inside this container.
        security_opt:
            - seccomp=unconfined
            - apparmor=unconfined
        build:
            # The final Dockerfile stage is cloud; self-hosting uses production.
            target: production
            args:
                HTTP_PROXY: "${HTTP_PROXY:-}"
                HTTPS_PROXY: "${HTTPS_PROXY:-}"
                NO_PROXY: "localhost,127.0.0.1,::1,paperclip,${NO_PROXY:-}"
                http_proxy: "${HTTP_PROXY:-}"
                https_proxy: "${HTTPS_PROXY:-}"
                no_proxy: "localhost,127.0.0.1,::1,paperclip,${NO_PROXY:-}"
        restart: unless-stopped
        depends_on:
            paperclip-db:
                condition: service_healthy
        # Existing tuna/nginx containers reach Paperclip through this network.
        networks:
            - default
            - tuna
        ports: !override
            - "127.0.0.1:${PAPERCLIP_PORT:-3100}:3100"
        environment:
            DATABASE_URL: "postgresql://paperclip:${PAPERCLIP_POSTGRES_PASSWORD:?Set a persistent database password in docker/.env}@paperclip-db:5432/paperclip_release_20261106"
            PAPERCLIP_DEPLOYMENT_MODE: authenticated
            PAPERCLIP_DEPLOYMENT_EXPOSURE: public
            PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?Set the public HTTPS URL in docker/.env}"
            HTTP_PROXY: "${HTTP_PROXY:-}"
            HTTPS_PROXY: "${HTTPS_PROXY:-}"
            NO_PROXY: "localhost,127.0.0.1,::1,paperclip,${NO_PROXY:-}"
            http_proxy: "${HTTP_PROXY:-}"
            https_proxy: "${HTTPS_PROXY:-}"
            no_proxy: "localhost,127.0.0.1,::1,paperclip,${NO_PROXY:-}"
            NODE_USE_ENV_PROXY: "1"
            LITELLM_API_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in docker/.env}"
        # Isolate the release instance; retain the previous data directory for rollback.
        volumes: !override
            - ../data/docker-paperclip-release-20261106:/paperclip

volumes:
    paperclip-public-pgdata:

networks:
    tuna:
        external: true
        name: docker_tuna
